[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-analytics"
version = "1.0.0"
description = "Product growth & experimentation analytics for a freemium fitness app (simulated data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
